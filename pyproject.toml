[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "qibotn"
version = "0.0.7"
description = "A tensor-network translation module for Qibo"
authors = ["The Qibo team"]
license = "Apache License 2.0"
readme = "README.md"
homepage = "https://qibo.science/"
repository = "https://github.com/qiboteam/qibotn/"
documentation = "https://qibo.science/docs/qibotn/stable"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
packages = [{ include = "qibotn", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
qibo = "^0.3.7"
qibojit = "^0.1.18"
quimb = { version = "^1.10.0", extras = ["tensor"] }
cupy-cuda12x = { version = "^13.6.0", optional = true }
cuda-toolkit = { version = "^12.9.1", extras = ["all"], optional = true }
nvidia-nccl-cu12 = { version = "^2.16.5", optional = true }
cuquantum-python-cu12 = { version = "^26.9.0", optional = true }
mpi4py = { version = "^4.0.0", optional = true }
# ``qmatchatea`` requires ``qiskit<2``, which requires ``symengine<0.14``, and the latter
# ships no wheels for Python 3.14. Hence, the ``qmatchatea`` extra is restricted to
# Python < 3.14. ``qredtea`` is pinned since later 0.3.x releases cap ``numpy<2.1.4``.
qmatchatea = { version = "^1.5.10", python = "<3.14", optional = true }
qiskit = { version = "^1.4.0", python = "<3.14", optional = true }
qtealeaves = { version = ">=1.7.21,<1.8.0", python = "<3.14", optional = true }
qredtea = { version = ">=0.3.13,<0.3.15", python = "<3.14", optional = true }


[tool.poetry.extras]
cuda = ["cupy-cuda12x", "cuda-toolkit", "nvidia-nccl-cu12", "cuquantum-python-cu12", "mpi4py"]
qmatchatea = ["qmatchatea", "qiskit", "qtealeaves", "qredtea"]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^5.3.0"
furo = "^2023.3.27"
sphinxcontrib-bibtex = "^2.5.0"
sphinx-copybutton = "^0.5.2"
sphinxcontrib-katex = "^0.9.9"

[tool.poetry.group.dev.dependencies]
ipython = "^8.34.0"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = ">=8,<10"
pytest-cov = "^4.1.0"
pytest-env = "^1.1.3"

[tool.poetry.group.analysis]
optional = true

[tool.poetry.group.analysis.dependencies]
pylint = ">=3.0.3,<5.0.0"

[tool.poe.tasks]
test = "pytest"
lint = "pylint src --errors-only"
lint-warnings = "pylint src --exit-zero"
docs = "make -C doc html"
docs-clean = "make -C doc clean"
test-docs = "make -C doc doctest"

[tool.pylint.main]
ignored-modules = ["cupy", "cuquantum", "mpi4py"]

[tool.pylint.reports]
output-format = "colorized"

[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = ["--cov=qibotn", "--cov-report=xml"]
env = ["D:NUMBA_DISABLE_JIT=1"]
